# DM Fan — BLE Remote Button Capture (Phase 3, Step 1)
# ──────────────────────────────────────────────────────────────────────────────
# Purpose: subscribe to GATT notifications on 0xFF01 and 0xFF02 and log the
# raw hex payload for every button press on the remote. Build the button→action
# map from the logged bytes, then integrate the mapping into dm_fan.h Phase 3.
#
# Key design choices
#   • dm_fan component stays active (ble_remote: false) → UART keepalive runs.
#     Without it the MCU pulls EN LOW after ~4 min → POWERON_RESET.
#   • bluetooth_proxy REMOVED. ble_client needs uncontested BLE radio access.
#   • sensor lambda (returns float = byte count) — NOT text_sensor.
#     Binary GATT data breaks HA API with "String field had bad UTF-8" if sent
#     as a text_sensor. The float never leaves ESPHome as raw bytes.
#   • notify: true on both 0xFF01 and 0xFF02.
#
# PROTOCOL UNDERSTANDING (2026-06-10)
# ──────────────────────────────────────────────────────────────────────────────
# App-layer handshake (CONFIRMED 2026-06-10):
#   1. Remote → ESP  FF01 NOTIFY: TokenA(6)|Mid(8)|TokenA(6)  (20 bytes)
#      Example: 29 b0 c3 6e 91 97  b4 71 00 01 03 01 00 03  29 b0 c3 6e 91 97
#   2. ESP    → Remote FF02 WRITE: same 20 bytes verbatim   ← "echo / bind"
#   3. Remote stops blinking.
#   4. Remote → ESP  FF01 NOTIFY: TokenB(6)|Mid2(8)|TokenB(6)  ← post-bind
#      Example: 0D 0A 40 15 DC 7C  45 43 00 01 03 01 00 03  0D 0A 40 15 DC 7C
#
# Nonce validation (CONFIRMED HS8/HS9 test 2026-06-10):
#   Bytes[6-7] of the challenge are validated — corrupting them (XOR/invert)
#   prevents blinking from stopping → the remote verifies frame content.
#
# After the bind (OPEN — button events not yet received):
#   The remote stops blinking (bind accepted) but sends NO button events.
#   Current hypothesis: BLE SMP link-layer encryption required.
#   This firmware DOES NOT echo the post-bind (step 4) — doing so confused the
#   remote in earlier sessions. Instead, it auto-triggers SMP after the post-bind
#   arrives (bind_state goes 1→2). If SMP proceeds, button events should follow.
#
# Bind state machine (bind_state global):
#   0 = IDLE       — no challenge received yet
#   1 = ECHO_SENT  — echoed challenge, remote stopped blinking, awaiting post-bind
#   2 = BOUND      — post-bind received, SMP triggered, awaiting button events
#
# HOW TO USE
#   1.  Flash this YAML via OTA: esphome run ble_capture.yaml
#   2.  Open ESPHome log: esphome logs ble_capture.yaml
#   3.  Hold remote near ESP32. Watch for:
#         [I][dm_cap] FF01 CHALLENGE-1 [20]: XX ... → state=1, echoing to FF02
#         [I][dm_cap] AUTO-ECHO: sent challenge to FF02
#         [I][dm_cap] FF01 POST-BIND  [20]: XX ... → state=2, SMP triggered
#         [D][BT_SMP] ...                ← SMP pairing log lines
#   4.  "BLE Bind State" in HA shows: 0=idle, 1=echoed, 2=bound.
#   5.  Once state=2 (and optionally "SMP → OK"), press remote buttons.
#       Look for: [I][dm_cap] FF01 EVENT ★ [N bytes]: XX XX XX ...
#       Record in PROTOCOL.md per-button table.
#   6.  If connection drops right after state=2 (DA14580 rejects SMP):
#       Press HS10 "Trigger SMP" ONLY if state=2 and blinking has stopped.
#       If it still drops: SMP may not be needed — try pressing buttons anyway.
#   7.  If auto-echo does NOT fire (state stays 0):
#       Press "BLE Re-read FF01+FF02", then press HS1 manually.
#
# Re-flash dm_fan.yaml when button capture is complete.
# ──────────────────────────────────────────────────────────────────────────────

substitutions:
  device_name: dreammaker-fan
  friendly_name: "Dream Maker Fan"
  remote_mac: "4B:F2:7E:47:E5:6E"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "BLE button capture — TEMPORARY"
  min_version: "2026.4.5"
  project:
    name: "d0np3p3.dreammaker-fan"
    version: "4.0.0-beta"
  on_boot:
    priority: -100
    then:
      - lambda: 'id(esp_idf_version).publish_state(esp_get_idf_version());'
      # SMP security params — must be set before any connection.
      # NO_MITM + IO_CAP_NONE = "Just Works" bonding (no PIN/passkey).
      # These are not used until esp_ble_set_encryption() is called (in the
      # post-bind handler, not on_connect — SMP before handshake disconnects DA14580).
      - lambda: |-
          esp_ble_auth_req_t auth = ESP_LE_AUTH_REQ_SC_BOND;
          esp_ble_gap_set_security_param(ESP_BLE_SM_AUTHEN_REQ_MODE, &auth, sizeof(auth));
          esp_ble_io_cap_t iocap = ESP_IO_CAP_NONE;
          esp_ble_gap_set_security_param(ESP_BLE_SM_IOCAP_MODE, &iocap, sizeof(iocap));
          uint8_t key_size = 16;
          esp_ble_gap_set_security_param(ESP_BLE_SM_MAX_KEY_SIZE, &key_size, sizeof(key_size));
          uint8_t init_key = ESP_BLE_ENC_KEY_MASK | ESP_BLE_ID_KEY_MASK;
          uint8_t rsp_key  = ESP_BLE_ENC_KEY_MASK | ESP_BLE_ID_KEY_MASK;
          esp_ble_gap_set_security_param(ESP_BLE_SM_SET_INIT_KEY, &init_key, sizeof(init_key));
          esp_ble_gap_set_security_param(ESP_BLE_SM_SET_RSP_KEY,  &rsp_key,  sizeof(rsp_key));
          ESP_LOGI("dm_cap", "SMP params set (Just Works bonding, deferred to post-bind)");

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

logger:
  level: INFO
  logs:
    dm_cap: INFO
    esp32_ble_client: INFO
    esp32_ble_tracker: INFO
    esp32_ble: INFO
    BT_SMP: DEBUG         # show SMP pairing/encryption events
    BT_GATT: INFO
    dm_fan: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret wifi_ap_password

captive_portal:

# ── External component ────────────────────────────────────────────────────────
external_components:
  - source:
      type: git
      url: https://github.com/d0np3p3/esphome-dreammaker-fan
      ref: v4.0.0-beta
    refresh: 0s
    components: [dm_fan]

# ── UART (MCU keepalive) ──────────────────────────────────────────────────────
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 19200

# ── Fan: dm_fan with BLE disabled (UART keepalive only) ───────────────────────
fan:
  - platform: dm_fan
    id: my_fan
    name: "DM Fan"
    uart_id: uart_bus
    ble_remote: false
    mcu_version:
      name: "MCU Version"
      entity_category: diagnostic
    temperature:
      name: "Temperatur"
      entity_category: diagnostic
    humidity:
      name: "Luftfeuchtigkeit"
      entity_category: diagnostic

# ── BLE: scan + connect to remote ────────────────────────────────────────────
esp32_ble_tracker:
  scan_parameters:
    active: true
    continuous: true

ble_client:
  - mac_address: ${remote_mac}
    id: dm_remote
    auto_connect: true
    on_connect:
      then:
        - logger.log:
            level: INFO
            format: "══ DM REMOTE CONNECTED — CCCD subscribing, reading FF01 ══"
        # Wait 1 s for CCCD subscriptions (notify: true sensors) to complete.
        # SMP is NOT triggered here — the DA14580 disconnects if we request
        # encryption before the app-layer handshake is complete.
        - delay: 1s
        # Only read FF01 if auto-echo hasn't already fired from a NOTIFY.
        # (If NOTIFY arrived during the 1 s delay, bind_state is already 1.)
        - lambda: |-
            if (id(bind_state) == 0) {
              id(cap_ff01).update();
            } else {
              ESP_LOGI("dm_cap", "on_connect: NOTIFY already handled bind_state=%d, skip read", id(bind_state));
            }
    on_disconnect:
      then:
        - logger.log:
            level: INFO
            format: "══ DM REMOTE DISCONNECTED — press a remote button to reconnect ══"
        - lambda: |-
            id(bind_state) = 0;
            id(last_ff01).clear();
            id(last_ff02).clear();
            ESP_LOGI("dm_cap", "bind_state reset to 0");

# ── State + capture buffers ───────────────────────────────────────────────────
globals:
  - id: last_ff01
    type: std::vector<uint8_t>
    restore_value: no
  - id: last_ff02
    type: std::vector<uint8_t>
    restore_value: no
  - id: bind_state
    type: int
    restore_value: no
    initial_value: '0'

# ── Auto-echo: write last_ff01 back to FF02 ───────────────────────────────────
script:
  - id: echo_ff01_to_ff02
    then:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF02"
          value: !lambda 'return id(last_ff01);'
      - logger.log:
          level: INFO
          tag: "dm_cap"
          format: "AUTO-ECHO: sent challenge to FF02"

# ── Raw byte capture ──────────────────────────────────────────────────────────
sensor:
  - platform: ble_client
    ble_client_id: dm_remote
    id: cap_ff01
    name: "BLE capture FF01 len"
    type: characteristic
    icon: "mdi:bluetooth"
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    service_uuid: "00FF"
    characteristic_uuid: "FF01"
    notify: true
    update_interval: never
    lambda: |-
      if (x.empty()) return 0.0f;

      // Compare with last stored value to detect duplicate callbacks.
      // A READ (from update()) can return the same frame a NOTIFY already
      // handled → is_new_data prevents double-echo and wrong state transitions.
      bool is_new_data = (x != id(last_ff01));
      id(last_ff01).assign(x.begin(), x.end());

      char hex[x.size() * 3 + 1];
      char *p = hex;
      for (uint8_t b : x) { p += snprintf(p, 4, "%02X ", b); }
      if (p > hex) *(p - 1) = '\0';

      // Mirror-pattern check: bytes[0..5] == bytes[14..19] → challenge frame.
      bool is_challenge = (x.size() == 20) &&
          std::equal(x.begin(), x.begin() + 6, x.begin() + 14);

      if (!is_new_data) {
        // Duplicate (READ returned same bytes as previous NOTIFY) — ignore.
        ESP_LOGD("dm_cap", "FF01 dup [%u]: %s", (unsigned)x.size(), hex);
      } else if (is_challenge && id(bind_state) == 0) {
        // First challenge → echo to FF02, advance state.
        ESP_LOGI("dm_cap", "FF01 CHALLENGE-1 [20]: %s → state=1, echoing to FF02", hex);
        id(bind_state) = 1;
        id(echo_ff01_to_ff02).execute();
      } else if (is_challenge && id(bind_state) == 1) {
        // Post-bind confirmation (also mirror-pattern, different token).
        // Do NOT echo this — echoing confused the remote in earlier sessions.
        // Trigger SMP now: the app-layer handshake is complete; if the remote
        // gates button events behind link-layer encryption, SMP will unblock them.
        ESP_LOGI("dm_cap", "FF01 POST-BIND  [20]: %s → state=2, SMP triggered", hex);
        id(bind_state) = 2;
        esp_bd_addr_t bda = {0x4B, 0xF2, 0x7E, 0x47, 0xE5, 0x6E};
        esp_err_t ret = esp_ble_set_encryption(bda, ESP_BLE_SEC_ENCRYPT_NO_MITM);
        ESP_LOGI("dm_cap", "SMP: esp_ble_set_encryption → %s",
                 ret == ESP_OK ? "OK" : esp_err_to_name(ret));
      } else {
        // Any other frame (non-mirror or state ≥ 2) → potential button event!
        ESP_LOGI("dm_cap", "FF01 EVENT ★ [%u]: %s  (state=%d)",
                 (unsigned)x.size(), hex, id(bind_state));
      }
      return (float)x.size();

  - platform: ble_client
    ble_client_id: dm_remote
    id: cap_ff02
    name: "BLE capture FF02 len"
    type: characteristic
    icon: "mdi:bluetooth"
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    service_uuid: "00FF"
    characteristic_uuid: "FF02"
    notify: true
    update_interval: never
    lambda: |-
      if (x.empty()) return 0.0f;
      id(last_ff02).assign(x.begin(), x.end());
      char hex[x.size() * 3 + 1];
      char *p = hex;
      for (uint8_t b : x) { p += snprintf(p, 4, "%02X ", b); }
      if (p > hex) *(p - 1) = '\0';
      ESP_LOGI("dm_cap", "FF02 data [%u]: %s  (state=%d)",
               (unsigned)x.size(), hex, id(bind_state));
      return (float)x.size();

  # Bind state visible in HA: 0=idle, 1=echo sent, 2=bound+SMP.
  - platform: template
    name: "BLE Bind State"
    id: bind_state_sensor
    icon: "mdi:link-variant"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 2s
    lambda: 'return (float)id(bind_state);'

  - platform: uptime
    name: "Uptime"
    icon: "mdi:timer-outline"
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    icon: "mdi:wifi"
    update_interval: 60s
    entity_category: diagnostic

# ── Version info ──────────────────────────────────────────────────────────────
text_sensor:
  - platform: version
    name: "ESPHome Version"
    icon: "mdi:package-up"
    entity_category: diagnostic

  - platform: template
    name: "ESP-IDF Version"
    id: esp_idf_version
    icon: "mdi:chip"
    entity_category: diagnostic
    update_interval: never

# ── Handshake experiments ─────────────────────────────────────────────────────
# HS1  (CONFIRMED WORKING): echo full FF01 → FF02 stops blinking.
# HS2–HS7: alternative handshake variants (not yet definitively tested).
# HS8/HS9: CONFIRMED FAILING 2026-06-10 — nonce bytes[6-7] are validated;
#           XOR/invert prevents bind → plain echo is the only correct response.
# HS10: manual SMP trigger — press if state=2 but button events don't arrive.
#
# Usage after auto-echo fails (state stays 0):
#   1. Press "BLE Re-read FF01+FF02" to fill last_ff01.
#   2. Press HS1. Watch remote LED: should stop blinking.
#   3. Re-read again. Press HS1 on the post-bind frame if state didn't advance.
button:
  - platform: template
    name: "BLE Re-read FF01+FF02"
    icon: "mdi:bluetooth-transfer"
    on_press:
      - lambda: 'id(cap_ff01).update();'
      - delay: 300ms
      - lambda: 'id(cap_ff02).update();'

  # HS1 — CONFIRMED: echoing full FF01 back to FF02 stops the remote blinking.
  - platform: template
    name: "BLE HS1: echo FF01 → FF02"
    icon: "mdi:numeric-1-box"
    on_press:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF02"
          value: !lambda |-
            if (id(last_ff01).empty()) {
              ESP_LOGW("dm_cap", "HS1: last_ff01 empty — re-read FF01 first");
              return std::vector<uint8_t>{};
            }
            ESP_LOGI("dm_cap", "HS1: echo FF01 (%u B) → FF02", (unsigned)id(last_ff01).size());
            return id(last_ff01);

  - platform: template
    name: "BLE HS2: echo token(6) → FF02"
    icon: "mdi:numeric-2-box"
    on_press:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF02"
          value: !lambda |-
            if (id(last_ff01).size() < 6) {
              ESP_LOGW("dm_cap", "HS2: FF01 < 6 bytes");
              return std::vector<uint8_t>{};
            }
            std::vector<uint8_t> tok(id(last_ff01).begin(), id(last_ff01).begin() + 6);
            ESP_LOGI("dm_cap", "HS2: echo TokenA(6) → FF02");
            return tok;

  - platform: template
    name: "BLE HS3: echo FF01 → FF01"
    icon: "mdi:numeric-3-box"
    on_press:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF01"
          value: !lambda |-
            if (id(last_ff01).empty()) {
              ESP_LOGW("dm_cap", "HS3: last_ff01 empty");
              return std::vector<uint8_t>{};
            }
            ESP_LOGI("dm_cap", "HS3: echo FF01 (%u B) → FF01", (unsigned)id(last_ff01).size());
            return id(last_ff01);

  - platform: template
    name: "BLE HS4: echo token(6) → FF01"
    icon: "mdi:numeric-4-box"
    on_press:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF01"
          value: !lambda |-
            if (id(last_ff01).size() < 6) {
              ESP_LOGW("dm_cap", "HS4: FF01 < 6 bytes");
              return std::vector<uint8_t>{};
            }
            std::vector<uint8_t> tok(id(last_ff01).begin(), id(last_ff01).begin() + 6);
            ESP_LOGI("dm_cap", "HS4: echo TokenA(6) → FF01");
            return tok;

  - platform: template
    name: "BLE HS5: echo FF02 → FF02"
    icon: "mdi:numeric-5-box"
    on_press:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF02"
          value: !lambda |-
            if (id(last_ff02).empty()) {
              ESP_LOGW("dm_cap", "HS5: last_ff02 empty");
              return std::vector<uint8_t>{};
            }
            ESP_LOGI("dm_cap", "HS5: echo FF02 (%u B) → FF02", (unsigned)id(last_ff02).size());
            return id(last_ff02);

  - platform: template
    name: "BLE HS6: 01 → FF02"
    icon: "mdi:numeric-6-box"
    on_press:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF02"
          value: [0x01]
      - logger.log: { level: INFO, format: "HS6: 01 → FF02" }

  - platform: template
    name: "BLE HS7: 01 → FF01"
    icon: "mdi:numeric-7-box"
    on_press:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF01"
          value: [0x01]
      - logger.log: { level: INFO, format: "HS7: 01 → FF01" }

  # HS8/HS9: CONFIRMED NOT WORKING (2026-06-10 hardware test).
  # Nonce bytes[6-7] are validated → corrupting them rejects the echo.
  # Kept here for reference / regression testing only.
  - platform: template
    name: "BLE HS8: invert nonce[6-7] → FF02  [FAILS]"
    icon: "mdi:numeric-8-box"
    on_press:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF02"
          value: !lambda |-
            if (id(last_ff01).size() < 20) {
              ESP_LOGW("dm_cap", "HS8: last_ff01 too short");
              return std::vector<uint8_t>{};
            }
            std::vector<uint8_t> v = id(last_ff01);
            v[6] = ~v[6]; v[7] = ~v[7];
            ESP_LOGI("dm_cap", "HS8: invert nonce[6-7]=%02X %02X → FF02", v[6], v[7]);
            return v;

  - platform: template
    name: "BLE HS9: XOR nonce[6-7] ^0x55 → FF02  [FAILS]"
    icon: "mdi:numeric-9-box"
    on_press:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF02"
          value: !lambda |-
            if (id(last_ff01).size() < 20) {
              ESP_LOGW("dm_cap", "HS9: last_ff01 too short");
              return std::vector<uint8_t>{};
            }
            std::vector<uint8_t> v = id(last_ff01);
            v[6] ^= 0x55; v[7] ^= 0x55;
            ESP_LOGI("dm_cap", "HS9: XOR-0x55 nonce[6-7]=%02X %02X → FF02", v[6], v[7]);
            return v;

  # HS10: manual SMP trigger. Use when bind_state=2 (post-bind received,
  # blinking stopped) but button events still don't arrive. The auto-trigger
  # in the post-bind handler should make this unnecessary, but it's here as
  # a fallback. Also useful to test SMP at state=1 (before post-bind).
  - platform: template
    name: "BLE HS10: Trigger SMP now"
    icon: "mdi:lock-outline"
    on_press:
      - lambda: |-
          esp_bd_addr_t bda = {0x4B, 0xF2, 0x7E, 0x47, 0xE5, 0x6E};
          esp_err_t ret = esp_ble_set_encryption(bda, ESP_BLE_SEC_ENCRYPT_NO_MITM);
          ESP_LOGI("dm_cap", "HS10 SMP: esp_ble_set_encryption → %s (state=%d)",
                   ret == ESP_OK ? "OK" : esp_err_to_name(ret), id(bind_state));
