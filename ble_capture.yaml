# DM Fan — BLE Remote Button Capture (Phase 3, Step 1)
# ──────────────────────────────────────────────────────────────────────────────
# Purpose: subscribe to GATT notifications on 0xFF01 and 0xFF02 and log the
# raw hex payload for every button press on the remote. Build the button→action
# map from the logged bytes, then integrate the mapping into dm_fan.h Phase 3.
#
# Key design choices
#   • dm_fan component stays active (ble_remote: false) → UART keepalive runs.
#     Without it the MCU pulls EN LOW after ~4 min → POWERON_RESET.
#   • bluetooth_proxy REMOVED. ble_client needs uncontested BLE radio access.
#   • sensor lambda (returns float = byte count) — NOT text_sensor.
#     Binary GATT data breaks HA API with "String field had bad UTF-8" if sent
#     as a text_sensor. The float never leaves ESPHome as raw bytes.
#   • notify: true on both 0xFF01 and 0xFF02. We do not yet know which
#     characteristic carries which button events.
#
# HOW TO USE
#   1.  Flash this YAML via OTA:
#         esphome run ble_capture.yaml
#   2.  Open ESPHome log (serial or: esphome logs ble_capture.yaml).
#   3.  Press ONE button on the remote (hold near the ESP32).
#       Wait for connection: "══ DM REMOTE CONNECTED ══"
#   4.  Press the button once more. Look for:
#         [I][dm_cap] FF01 notify [N bytes]: XX XX XX ...
#         [I][dm_cap] FF02 notify [N bytes]: XX XX XX ...
#   5.  Record the hex in PROTOCOL.md under "Per-button capture table".
#   6.  Repeat for every button:
#         Power | Speed+ | Speed- | Mode | Oscillation on/off
#         Osc angle (each step) | Timer | Sound | LED | Child-lock
#   7.  When the map is complete, implement the Phase 3 handler in dm_fan.h:
#         on_gattc_event(ESP_GATTC_NOTIFY_EVT) → parse payload → call
#         set_power() / set_speed() / etc.
#
# FINDINGS SO FAR  (2026-06-10, ble_discovery.yaml run)
#   Remote MAC:   4B:F2:7E:47:E5:6E
#   Company ID:   0x4D44  ("DM")
#   GATT service: 0x00FF  handles 0x10–0x18
#     0xFF01  handle 0x12  props 0x16  READ · WRITE_NR · NOTIFY
#     0xFF02  handle 0x16  props 0x1A  READ · WRITE  ·  NOTIFY
#   First read on connect (0xFF01, 20 bytes, exact trigger unknown):
#     29 b0 c3 6e 91 97 b4 71 00 01 03 01 00 03 29 b0 c3 6e 91 97
#   Connection succeeded WITHOUT bonding → bonding likely not required.
#
# FINDINGS 2026-06-10, first ble_capture.yaml run
#   • Connection + service discovery OK, but ZERO notifications on button press.
#   • Remote keeps blinking after connect = waiting for a handshake response
#     (with original FW the ESP/MCU answers and blinking stops).
#   • Both disconnects (HCI reason 0x08 = supervision timeout) were caused by
#     BATTERY REMOVAL, not by the remote giving up — the link itself is stable.
#   → The remote requires a WRITE from us before it streams button events.
#     This is the Tuya BLE bind handshake the original ESP module performed
#     (DreamMaker is a Tuya OEM; see PROTOCOL.md "Tuya OEM match").
#     Use the "BLE HS1…HS7" buttons in HA (below) to try handshake variants
#     while connected. Watch remote LED: blinking stops = correct handshake.
#     If none work, the bind needs the encrypted Tuya key exchange → SWD-dump
#     the DA14580 remote to recover it.
#
# Re-flash dm_fan.yaml when capture is complete.
# ──────────────────────────────────────────────────────────────────────────────

substitutions:
  device_name: dreammaker-fan
  friendly_name: "Dream Maker Fan"
  remote_mac: "4B:F2:7E:47:E5:6E"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "BLE button capture — TEMPORARY"
  min_version: "2026.4.5"
  project:
    name: "d0np3p3.dreammaker-fan"
    version: "4.0.0-beta"
  on_boot:
    priority: -100
    then:
      - lambda: 'id(esp_idf_version).publish_state(esp_get_idf_version());'

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

logger:
  level: INFO
  logs:
    dm_cap: INFO           # our capture log tag — always visible
    esp32_ble_client: INFO
    esp32_ble_tracker: INFO
    esp32_ble: INFO
    dm_fan: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret wifi_ap_password

captive_portal:

# ── External component (same source as dm_fan.yaml) ──────────────────────────
external_components:
  - source:
      type: git
      url: https://github.com/d0np3p3/esphome-dreammaker-fan
      ref: v4.0.0-beta
    refresh: 0s
    components: [dm_fan]
  # Local override for development:
  # - source:
  #     type: local
  #     path: components
  #   components: [dm_fan]

# ── UART (kept alive to satisfy MCU keepalive) ────────────────────────────────
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 19200

# ── Fan: dm_fan with BLE disabled (UART only) ─────────────────────────────────
# ble_remote: false → no BLE scanning by dm_fan; the BLE radio is used
# exclusively by the ble_client below.
fan:
  - platform: dm_fan
    id: my_fan
    name: "DM Fan"
    uart_id: uart_bus
    ble_remote: false
    mcu_version:
      name: "MCU Version"
      entity_category: diagnostic
    temperature:
      name: "Temperatur"
      entity_category: diagnostic
    humidity:
      name: "Luftfeuchtigkeit"
      entity_category: diagnostic

# ── BLE: scan + connect to remote ────────────────────────────────────────────
esp32_ble_tracker:
  scan_parameters:
    active: true
    continuous: true

ble_client:
  - mac_address: ${remote_mac}
    id: dm_remote
    auto_connect: true
    on_connect:
      then:
        - logger.log:
            level: INFO
            format: "══ DM REMOTE CONNECTED — reading FF01+FF02 hello, then try HS buttons ══"
        # Read BOTH characteristics right away. The lambdas below log each value
        # and store it (last_ff01 / last_ff02) so the echo experiments can use it.
        # FF02 was never observed yet — read it so we know if it holds a 2nd token.
        - delay: 1s
        - lambda: 'id(cap_ff01).update();'
        - delay: 500ms
        - lambda: 'id(cap_ff02).update();'
    on_disconnect:
      then:
        - logger.log:
            level: INFO
            format: "══ DM REMOTE DISCONNECTED — press a remote button to reconnect ══"

# Last values read/notified on each char — used by the echo handshake experiments.
globals:
  - id: last_ff01
    type: std::vector<uint8_t>
    restore_value: no
  - id: last_ff02
    type: std::vector<uint8_t>
    restore_value: no

# Auto-echo script: write current last_ff01 back to FF02.
# Called by the FF01 sensor lambda whenever a challenge frame arrives.
# A challenge frame has the same 6-byte token at byte 0 and byte 14
# (structure: TokenA(6) | Mid(8) | TokenA(6)).
script:
  - id: echo_ff01_to_ff02
    then:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF02"
          value: !lambda 'return id(last_ff01);'
      - logger.log:
          level: INFO
          tag: "dm_cap"
          format: "AUTO-ECHO: sent FF01 challenge back to FF02"

# ── Raw byte capture ──────────────────────────────────────────────────────────
# sensor returns payload length (float) — HA only sees a number, never raw bytes.
# The lambda hex-dumps the bytes to the serial/OTA log as [I][dm_cap] lines.
#
# update_interval: never  → sensor is purely notification-driven, no polling.
sensor:
  - platform: ble_client
    ble_client_id: dm_remote
    id: cap_ff01
    name: "BLE capture FF01 len"
    type: characteristic
    icon: "mdi:bluetooth"
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    service_uuid: "00FF"
    characteristic_uuid: "FF01"
    notify: true
    update_interval: never
    lambda: |-
      if (x.empty()) return 0.0f;
      id(last_ff01).assign(x.begin(), x.end());
      char hex[x.size() * 3 + 1];
      char *p = hex;
      for (uint8_t b : x) { p += snprintf(p, 4, "%02X ", b); }
      if (p > hex) *(p - 1) = '\0';
      // Detect challenge frame: 20 bytes, bytes[0..5] == bytes[14..19].
      bool is_challenge = (x.size() == 20) &&
          std::equal(x.begin(), x.begin() + 6, x.begin() + 14);
      if (is_challenge) {
        ESP_LOGI("dm_cap", "FF01 CHALLENGE [20 bytes]: %s → echoing to FF02", hex);
        id(echo_ff01_to_ff02).execute();
      } else {
        ESP_LOGI("dm_cap", "FF01 EVENT    [%u bytes]: %s", (unsigned)x.size(), hex);
      }
      return (float)x.size();

  - platform: ble_client
    ble_client_id: dm_remote
    id: cap_ff02
    name: "BLE capture FF02 len"
    type: characteristic
    icon: "mdi:bluetooth"
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    service_uuid: "00FF"
    characteristic_uuid: "FF02"
    notify: true
    update_interval: never
    lambda: |-
      if (x.empty()) return 0.0f;
      id(last_ff02).assign(x.begin(), x.end());
      char hex[x.size() * 3 + 1];
      char *p = hex;
      for (uint8_t b : x) { p += snprintf(p, 4, "%02X ", b); }
      if (p > hex) *(p - 1) = '\0';  // trim trailing space
      ESP_LOGI("dm_cap", "FF02 data [%u bytes]: %s", (unsigned)x.size(), hex);
      return (float)x.size();

  # ── Diagnostic sensors (same as dm_fan.yaml) ─────────────────────────────
  - platform: uptime
    name: "Uptime"
    icon: "mdi:timer-outline"
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    icon: "mdi:wifi"
    update_interval: 60s
    entity_category: diagnostic

# ── Version info ─────────────────────────────────────────────────────────────
text_sensor:
  - platform: version
    name: "ESPHome Version"
    icon: "mdi:package-up"
    entity_category: diagnostic

  - platform: template
    name: "ESP-IDF Version"
    id: esp_idf_version
    icon: "mdi:chip"
    entity_category: diagnostic
    update_interval: never

# ── Handshake experiments ─────────────────────────────────────────────────────
# The remote blinks after connect and sends NO notification — it expects a write
# from us first (the Tuya BLE bind handshake the original ESP module performed).
#
# The 20-byte FF01 value has the shape:  TokenA(6) | Mid(8) | TokenA(6)
#   29 b0 c3 6e 91 97 | b4 71 00 01 03 01 00 03 | 29 b0 c3 6e 91 97
# The repeated 6-byte TokenA is the prime challenge-response suspect: the remote
# likely wants TokenA (or the whole frame) written back, possibly to FF02.
#
# HOW TO RUN (remote connected + still blinking):
#   1. Confirm the log shows "FF01 data [20 bytes]: …" (auto-read on connect).
#      If not, press "BLE Re-read FF01+FF02".
#   2. Press the HS buttons IN ORDER (HS1 → HS7), waiting ~5 s after each.
#   3. After each press watch:
#        • remote LED  → blinking STOPS = handshake accepted ✓✓✓
#        • the log     → new "FFxx data […]" lines = button events flowing ✓
#   4. Note WHICH HS button changed things, then press remote buttons to capture.
#   5. Press "BLE Re-read FF01+FF02" after a promising HS — a successful bind
#      often changes the readable characteristic value (state advanced).
#
# Ordering rationale (most → least likely for a DA14580 Tuya-style bind):
#   HS1 echo full FF01 → FF02   (write char, classic challenge echo)
#   HS2 echo TokenA(6) → FF02   (echo just the repeated token)
#   HS3 echo full FF01 → FF01   (write-no-response char)
#   HS4 echo TokenA(6) → FF01
#   HS5 echo full FF02 → FF02   (if FF02 held its own token)
#   HS6 write 0x01     → FF02   (trivial ACK)
#   HS7 write 0x01     → FF01
button:
  - platform: template
    name: "BLE Re-read FF01+FF02"
    icon: "mdi:bluetooth-transfer"
    on_press:
      - lambda: 'id(cap_ff01).update();'
      - delay: 300ms
      - lambda: 'id(cap_ff02).update();'

  - platform: template
    name: "BLE HS1: echo FF01 → FF02"
    icon: "mdi:numeric-1-box"
    on_press:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF02"
          value: !lambda |-
            if (id(last_ff01).empty()) {
              ESP_LOGW("dm_cap", "HS1: last_ff01 empty — re-read FF01 first");
              return std::vector<uint8_t>{};
            }
            ESP_LOGI("dm_cap", "HS1 sent: echo full FF01 (%u B) -> FF02", (unsigned)id(last_ff01).size());
            return id(last_ff01);

  - platform: template
    name: "BLE HS2: echo token → FF02"
    icon: "mdi:numeric-2-box"
    on_press:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF02"
          value: !lambda |-
            if (id(last_ff01).size() < 6) {
              ESP_LOGW("dm_cap", "HS2: FF01 < 6 bytes — re-read FF01 first");
              return std::vector<uint8_t>{};
            }
            std::vector<uint8_t> tok(id(last_ff01).begin(), id(last_ff01).begin() + 6);
            ESP_LOGI("dm_cap", "HS2 sent: echo TokenA(6) -> FF02");
            return tok;

  - platform: template
    name: "BLE HS3: echo FF01 → FF01"
    icon: "mdi:numeric-3-box"
    on_press:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF01"
          value: !lambda |-
            if (id(last_ff01).empty()) {
              ESP_LOGW("dm_cap", "HS3: last_ff01 empty — re-read FF01 first");
              return std::vector<uint8_t>{};
            }
            ESP_LOGI("dm_cap", "HS3 sent: echo full FF01 (%u B) -> FF01", (unsigned)id(last_ff01).size());
            return id(last_ff01);

  - platform: template
    name: "BLE HS4: echo token → FF01"
    icon: "mdi:numeric-4-box"
    on_press:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF01"
          value: !lambda |-
            if (id(last_ff01).size() < 6) {
              ESP_LOGW("dm_cap", "HS4: FF01 < 6 bytes — re-read FF01 first");
              return std::vector<uint8_t>{};
            }
            std::vector<uint8_t> tok(id(last_ff01).begin(), id(last_ff01).begin() + 6);
            ESP_LOGI("dm_cap", "HS4 sent: echo TokenA(6) -> FF01");
            return tok;

  - platform: template
    name: "BLE HS5: echo FF02 → FF02"
    icon: "mdi:numeric-5-box"
    on_press:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF02"
          value: !lambda |-
            if (id(last_ff02).empty()) {
              ESP_LOGW("dm_cap", "HS5: last_ff02 empty — re-read FF02 first");
              return std::vector<uint8_t>{};
            }
            ESP_LOGI("dm_cap", "HS5 sent: echo full FF02 (%u B) -> FF02", (unsigned)id(last_ff02).size());
            return id(last_ff02);

  - platform: template
    name: "BLE HS6: 01 → FF02"
    icon: "mdi:numeric-6-box"
    on_press:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF02"
          value: [0x01]
      - logger.log: { level: INFO, format: "HS6 sent: 01 -> FF02" }

  - platform: template
    name: "BLE HS7: 01 → FF01"
    icon: "mdi:numeric-7-box"
    on_press:
      - ble_client.ble_write:
          id: dm_remote
          service_uuid: "00FF"
          characteristic_uuid: "FF01"
          value: [0x01]
      - logger.log: { level: INFO, format: "HS7 sent: 01 -> FF01" }
