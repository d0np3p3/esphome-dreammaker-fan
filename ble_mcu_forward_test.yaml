# DM Fan — Test: Beacon-Weiterleitung an die MCU (0x1F41)
# ──────────────────────────────────────────────────────────────────────────────
# HYPOTHESE
#   Die Fernbedienung sendet ihren Tastendruck verschlüsselt als BLE-Beacon.
#   Das originale ESP-Modul war vermutlich nur die Funkbrücke und hat die rohen
#   8 Byte per UART (resource 0x1F41) an die MCU durchgereicht — die MCU wäre
#   dann die entschlüsselnde Seite.
#
#   Falls das stimmt, reagiert der Fan nach Einschalten der Weiterleitung wieder
#   auf die Fernbedienung — OHNE dass wir die Verschlüsselung knacken oder eine
#   Lerntabelle bauen müssen. Das würde Phase 3 praktisch erledigen.
#
# ⚠️ RISIKO — DESHALB EIN SCHALTER STATT FESTER KONFIGURATION
#   Das Frame-Format ist korrigiert (folgt jetzt der bestätigten Envelope), aber
#   weiterhin UNBESTÄTIGT. Laut Firmware-Strings führt "BLE->mcu report timeout!"
#   nach 2 Fehlversuchen zu SW_CPU_RESET (0x238D).
#
#   Die Weiterleitung ist daher als HA-Schalter gebaut und startet IMMER AUS
#   (restore_mode: ALWAYS_OFF). Falls der ESP resettet, ist sie nach dem Neustart
#   wieder aus — keine Reset-Schleife.
#
# ABLAUF
#   1. Flashen. Schalter "BLE→MCU Weiterleitung" bleibt AUS.
#   2. Taste an der Fernbedienung drücken. Im Log muss erscheinen:
#        [I][dm_fan] DM remote beacon ... status=0x02 payload[8]=[ ... ]
#      → Beacons kommen an. Falls nicht: Fernbedienung/Reichweite prüfen.
#   3. Schalter EINSCHALTEN.
#   4. Taste drücken. Jetzt im Log erwartet:
#        [I][dm_fan] BLE→MCU report (0x1F41, beacon ctr=.., msg ctr=..)
#        [I][dm_fan] MCU ACKed BLE report (action:82 res:0x1F41, len=..)   ← ⭐
#   5. Beobachten was passiert:
#
#      ✅ MCU ACKed + Fan reagiert   → Volltreffer, Phase 3 fast fertig
#      🟡 MCU ACKed, Fan reagiert nicht → Format ok, aber MCU entschlüsselt
#                                        nicht → Lerntabelle nötig
#      🔴 Kein ACK / ESP resettet     → Format falsch. SOFORT Schalter aus.
#                                        Log schicken.
#
#   6. Bei Reset: der Schalter ist nach dem Neustart automatisch wieder aus.
#
# ⚠️ Fernbedienung NICHT neu koppeln (Power+M)! Der Bond ist intakt (Counter
#    läuft weiter), ein Reset würde alle Payloads ändern.
#
# ⚠️ scan window 300ms bei interval 320ms = ~94% BLE-Duty-Cycle → mögliche
#    WLAN-Aussetzer. Nur für den Test so lassen.
# ──────────────────────────────────────────────────────────────────────────────

substitutions:
  device_name: dreammaker-fan
  friendly_name: "Dream Maker Fan"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Test 0x1F41 Beacon-Weiterleitung — TEMPORÄR"
  min_version: "2026.4.5"
  project:
    name: "d0np3p3.dreammaker-fan"
    version: "4.0.0-beta-mcufwd"
  on_boot:
    priority: -100
    then:
      - lambda: 'id(esp_idf_version).publish_state(esp_get_idf_version());'
      - logger.log:
          level: WARN
          format: "══ 0x1F41-TEST — Weiterleitung startet AUS, in HA einschalten ══"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

logger:
  level: DEBUG
  logs:
    dm_fan: DEBUG              # Beacons, 0x1F41-Report und MCU-ACK
    esp32_ble_tracker: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret wifi_ap_password

captive_portal:

# ── External component ────────────────────────────────────────────────────────
external_components:
  - source:
      type: git
      url: https://github.com/d0np3p3/esphome-dreammaker-fan
      ref: v4.0.0-beta
    refresh: 0s
    components: [dm_fan]

# ── UART ─────────────────────────────────────────────────────────────────────
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 19200

# ── BLE-Tracker (von ble_remote: true vorausgesetzt) ─────────────────────────
esp32_ble_tracker:
  scan_parameters:
    active: false
    interval: 320ms
    window: 300ms

# ── Fan ──────────────────────────────────────────────────────────────────────
# ble_remote: true  → dm_fan wertet die Beacons selbst aus (parse_device).
# ble_report_to_mcu bleibt hier AUS — es wird zur Laufzeit über den Schalter
# unten gesetzt, damit man es sofort abschalten kann.
fan:
  - platform: dm_fan
    id: my_fan
    name: "DM Fan"
    uart_id: uart_bus
    ble_remote: true
    ble_report_to_mcu: false
    mcu_version:
      name: "MCU Version"
      entity_category: diagnostic
    temperature:
      name: "Temperatur"
      entity_category: diagnostic
    humidity:
      name: "Luftfeuchtigkeit"
      entity_category: diagnostic

# ── DER SICHERHEITSSCHALTER ──────────────────────────────────────────────────
switch:
  - platform: template
    name: "BLE→MCU Weiterleitung (0x1F41)"
    icon: "mdi:transfer-right"
    optimistic: true
    restore_mode: ALWAYS_OFF     # nach Reset immer aus — keine Reset-Schleife
    turn_on_action:
      - lambda: 'id(my_fan)->set_ble_report_to_mcu(true);'
      - logger.log:
          level: WARN
          format: "0x1F41-Weiterleitung EIN — Taste drücken, auf MCU-ACK achten"
    turn_off_action:
      - lambda: 'id(my_fan)->set_ble_report_to_mcu(false);'
      - logger.log:
          level: WARN
          format: "0x1F41-Weiterleitung AUS"

  - platform: template
    name: "Kindersicherung"
    icon: "mdi:baby-carriage"
    entity_category: config
    optimistic: true
    turn_on_action:  { lambda: "id(my_fan)->set_child_lock(true);" }
    turn_off_action: { lambda: "id(my_fan)->set_child_lock(false);" }

  - platform: template
    name: "LED Anzeige"
    icon: "mdi:led-on"
    entity_category: config
    optimistic: true
    turn_on_action:  { lambda: "id(my_fan)->set_led(true);" }
    turn_off_action: { lambda: "id(my_fan)->set_led(false);" }

  - platform: template
    name: "Tastentöne"
    icon: "mdi:volume-high"
    entity_category: config
    optimistic: true
    turn_on_action:  { lambda: "id(my_fan)->set_sound(true);" }
    turn_off_action: { lambda: "id(my_fan)->set_sound(false);" }

# ── Bedienung (um zu sehen, ob der Fan auf die Remote reagiert) ──────────────
select:
  - platform: template
    name: "Oszillationswinkel"
    icon: "mdi:angle-obtuse"
    entity_category: config
    optimistic: true
    initial_option: "90°"
    options: ["30°", "60°", "90°", "120°", "140°"]
    set_action:
      lambda: |-
        int deg = 90;
        if (x == "30°")  deg = 30;
        if (x == "60°")  deg = 60;
        if (x == "90°")  deg = 90;
        if (x == "120°") deg = 120;
        if (x == "140°") deg = 140;
        id(my_fan)->set_roll_angle(deg);

number:
  - platform: template
    name: "Timer (Stunden)"
    icon: "mdi:timer-outline"
    min_value: 0
    max_value: 8
    step: 1
    entity_category: config
    optimistic: true
    set_action:
      lambda: "id(my_fan)->set_timer_hours(x);"

# ── Diagnose ─────────────────────────────────────────────────────────────────
sensor:
  - platform: uptime
    name: "Uptime"
    icon: "mdi:timer-outline"
    entity_category: diagnostic     # springt zurück = ESP wurde resettet!

  - platform: wifi_signal
    name: "WiFi Signal"
    icon: "mdi:wifi"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "ESPHome Version"
    icon: "mdi:package-up"
    entity_category: diagnostic

  - platform: template
    name: "ESP-IDF Version"
    id: esp_idf_version
    icon: "mdi:chip"
    entity_category: diagnostic
    update_interval: never

  # Reset-Grund — zeigt SW_CPU_RESET, falls die MCU den ESP zurücksetzt.
  - platform: template
    name: "Letzter Reset-Grund"
    icon: "mdi:restart-alert"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      switch (esp_reset_reason()) {
        case ESP_RST_POWERON:  return std::string("POWERON");
        case ESP_RST_SW:       return std::string("SW_CPU_RESET");
        case ESP_RST_PANIC:    return std::string("PANIC");
        case ESP_RST_INT_WDT:  return std::string("INT_WDT");
        case ESP_RST_TASK_WDT: return std::string("TASK_WDT");
        case ESP_RST_WDT:      return std::string("WDT");
        case ESP_RST_BROWNOUT: return std::string("BROWNOUT");
        case ESP_RST_EXT:      return std::string("EXT (MCU EN-Pin!)");
        default:               return std::string("other");
      }

button:
  - platform: template
    name: "Nach Links drehen"
    icon: "mdi:pan-left"
    on_press:
      lambda: "id(my_fan)->rotate_left();"

  - platform: template
    name: "Nach Rechts drehen"
    icon: "mdi:pan-right"
    on_press:
      lambda: "id(my_fan)->rotate_right();"
