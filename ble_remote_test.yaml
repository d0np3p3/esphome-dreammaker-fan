# DM Fan — BLE Remote Lerntabellen-Capture (Phase 3, Hauptweg)
# ──────────────────────────────────────────────────────────────────────────────
# ZWECK
#   Die Fernbedienung sendet Tastendrücke als BLE-Advertisement mit
#   status=0x02 und 8 Byte verschlüsselter Nutzlast. Die Zuordnung
#   Zielzustand → Payload ist DETERMINISTISCH (bewiesen durch Wiederholungen),
#   deshalb ist keine Entschlüsselung nötig — eine Lerntabelle reicht.
#
#   Diese YAML loggt pro Tastendruck EINE Zeile:
#
#     [W][dm_learn] LEARN #3 | Power        | ctr=4E | payload= 92 43 A0 3F A6 59 2F AA
#
#   ⚠️ WARUM EIN LABEL STATT DES FAN-ZUSTANDS?
#   Eine frühere Fassung loggte den Fan-Zustand nach dem Tastendruck. Das ist
#   sinnlos: seit ESPHome drauf ist, reagiert der Fan NICHT mehr auf die
#   Fernbedienung (die Beacons werden nicht an die MCU weitergeleitet). Der
#   Zustand blieb deshalb immer power=OFF speed=0.
#   Stattdessen wird jetzt in HA über das Select "Lern-Label (Taste)"
#   eingestellt, welche Taste gerade getestet wird — dieser Text steht in
#   jeder LEARN-Zeile.
#
# ⚠️ WICHTIG — VOR DEM FLASHEN LESEN
#   1. NVS SICHERN! Der aktuell gepairte Fan hat den Bond im NVS
#      (ble_model=513, ble_mac, ble_key). Flashen kann das überschreiben.
#         esptool.py --port COMx read_flash 0x9000 0x4000 nvs_backup.bin
#   2. NACH dem Flashen NICHT Power+M an der Fernbedienung drücken!
#      Das löscht den Bond → alle Payloads ändern sich → Tabelle wertlos.
#      Die Fernbedienung sendet ihre Kommando-Beacons weiter, auch wenn der
#      Fan nicht mehr antwortet — genau das nutzen wir hier aus.
#
# HINWEIS ZUM KEY
#   Der ble_key aus dem NVS wird hier NICHT gebraucht. Wir entschlüsseln nichts,
#   wir gleichen nur Payloads ab. Der Key wäre nur für generisches Entschlüsseln
#   nötig — und dessen Algorithmus ist ohnehin unbekannt.
#
# ABLAUF — eine Taste pro Serie, damit die Zuordnung eindeutig bleibt
#   1. Flashen, Log öffnen: esphome logs ble_remote_test.yaml
#   2. In HA "Lern-Label (Taste)" auf z. B. "Power" stellen.
#   3. NUR diese Taste drücken — mehrfach, mit ~2 s Pause:
#        Power       6× (An/Aus/An/Aus/An/Aus → erwartet 2 abwechselnde Payloads)
#        Speed       8× (2 volle Zyklen à 4 Stufen → erwartet 4 Payloads)
#        Mode-lang   6× (2 volle Zyklen à 3 Modi → erwartet 3 Payloads)
#        Oszillation 4× (erwartet 2 abwechselnde Payloads)
#        Timer      10× (2 volle Zyklen à 5 Stufen → erwartet 5 Payloads)
#   4. Label umstellen, nächste Taste. Immer nur EINE Taste pro Serie.
#   5. LEARN-Zeilen schicken/in PROTOCOL.md eintragen.
#
#   Der Zyklus-Ansatz ist der Trick: wenn eine Taste durchzykelt und wieder am
#   Anfang landet, MUSS sich die Payload wiederholen. Daraus ergibt sich, wie
#   viele Zustände es gibt und welche Payload zu welcher Stufe gehört — ganz
#   ohne dass der Fan reagieren muss.
#
# ⚠️ scan window 300ms bei interval 320ms = ~94% BLE-Duty-Cycle. WLAN und BLE
#    teilen sich beim ESP32 eine Antenne → mögliche WLAN-Aussetzer. Nur zum
#    Capturen so lassen, danach window zurück auf 30ms.
# ──────────────────────────────────────────────────────────────────────────────

substitutions:
  device_name: dreammaker-fan
  friendly_name: "Dream Maker Fan"
  # Bekannte Fernbedienung — nur zum Hervorheben im Log, es werden ALLE
  # DM-Beacons geloggt (falls eine zweite Remote auftaucht).
  known_remote: "4B:F2:7E:47:E5:6E"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "BLE Remote Lerntabellen-Capture — TEMPORÄR"
  min_version: "2026.4.5"
  project:
    name: "d0np3p3.dreammaker-fan"
    version: "4.0.0-beta-learn"
  on_boot:
    priority: -100
    then:
      - lambda: 'id(esp_idf_version).publish_state(esp_get_idf_version());'
      - logger.log:
          level: WARN
          format: "══ LERNMODUS AKTIV — Taste drücken, LEARN-Zeilen abwarten ══"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

logger:
  level: DEBUG
  logs:
    dm_remote: INFO    # Beacon-Rohdaten
    dm_learn: INFO     # die LEARN-Zeilen (WARN, immer sichtbar)
    esp32_ble_tracker: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} Fallback"
    password: !secret wifi_ap_password

captive_portal:

# ── External component ────────────────────────────────────────────────────────
external_components:
  - source:
      type: git
      url: https://github.com/d0np3p3/esphome-dreammaker-fan
      ref: v4.0.0-beta
    refresh: 0s
    components: [dm_fan]
  # Lokal zum Entwickeln:
  # - source:
  #     type: local
  #     path: components
  #   components: [dm_fan]

# ── UART ─────────────────────────────────────────────────────────────────────
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 19200

# ── BLE: Fernbedienung passiv mitschneiden ───────────────────────────────────
# Manufacturer Data, Company ID 0x4D44 ("DM") — die 2 Byte Company ID sind in
# d.data NICHT enthalten, ESPHome legt sie in d.uuid.
#
#   [0][1]    = 02 01      Protokoll-Version
#   [2..7]    = MAC
#   [8]       = counter    steigt pro Event, Reset auf 01 bei Neu-Pairing
#   [9]       = status     0x01 = Idle-Heartbeat, 0x02 = Kommando/Tastendruck
#   [10..17]  = payload    bei Idle 00×8, sonst 8 Byte Nutzdaten
esp32_ble_tracker:
  scan_parameters:
    active: false      # passiv — nur mithören
    interval: 320ms
    window: 300ms      # DEBUG-Wert, Normalbetrieb 30ms
  on_ble_advertise:
    then:
      - lambda: |-
          for (const auto &d : x.get_manufacturer_datas()) {
            if (!(d.uuid == esp32_ble_tracker::ESPBTUUID::from_uint16(0x4D44)))
              continue;
            if (d.data.size() < 18) {
              ESP_LOGI("dm_remote", "%s short len=%u",
                       x.address_str().c_str(), (unsigned) d.data.size());
              continue;
            }
            const uint8_t ctr = d.data[8];
            const uint8_t st  = d.data[9];

            char buf[8];
            std::string pl;
            for (size_t i = 10; i < 18; i++) {
              snprintf(buf, sizeof(buf), "%02X ", d.data[i]);
              pl += buf;
            }

            if (st == 0x01) {
              // Idle-Heartbeat — nur auf DEBUG, sonst flutet es das Log.
              ESP_LOGD("dm_remote", "%s idle ctr=%02X",
                       x.address_str().c_str(), ctr);
            } else {
              // Kommando-Beacon. Payload merken und den Zustand danach loggen.
              ESP_LOGI("dm_remote", "%s CMD st=%02X ctr=%02X payload= %s",
                       x.address_str().c_str(), st, ctr, pl.c_str());
              // Wiederholte Beacons desselben Tastendrucks unterdrücken:
              // gleicher Counter = dasselbe Event. Die Remote sendet jeden
              // Tastendruck bis zu ~150× — nur der Counter-Wechsel zählt.
              if (ctr != id(last_ctr)) {
                id(last_ctr) = ctr;
                id(last_payload) = pl;
                id(cmd_count) += 1;
                // SOFORT loggen, nicht verzögert: der Fan reagiert nicht mehr
                // auf die Remote, ein späterer Zustand bringt also nichts —
                // und eine Verzögerung würde bei schnellen Tastenfolgen
                // Events verschlucken.
                ESP_LOGW("dm_learn", "LEARN #%d | %-12s | ctr=%02X | payload= %s",
                         id(cmd_count), id(learn_label).c_str(), ctr, pl.c_str());
              }
            }
          }

# ── Zustand für die Lerntabelle ──────────────────────────────────────────────
globals:
  - id: last_payload
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: last_ctr
    type: int
    restore_value: no
    initial_value: '-1'
  - id: cmd_count
    type: int
    restore_value: no
    initial_value: '0'
  # Welche Taste gerade getestet wird — über das Select in HA gesetzt.
  # Der Fan reagiert NICHT mehr auf die Fernbedienung (ESPHome leitet die
  # Beacons nicht an die MCU weiter), deshalb kann die Bedeutung einer Payload
  # nicht aus dem Fan-Zustand abgelesen werden — sie muss beschriftet werden.
  - id: learn_label
    type: std::string
    restore_value: no
    initial_value: '"?"'

# Kein Verzögerungs-Script mehr — es wird direkt in der Beacon-Lambda geloggt.

# ── Fan ──────────────────────────────────────────────────────────────────────
# ble_remote bleibt aus (default false) — das Scannen macht die Lambda oben.
# So gibt es keine doppelte Beacon-Auswertung.
fan:
  - platform: dm_fan
    id: my_fan
    name: "DM Fan"
    uart_id: uart_bus
    # log_raw_frames: true   # einkommentieren, wenn die MCU-Frames gebraucht werden
    mcu_version:
      name: "MCU Version"
      entity_category: diagnostic
    temperature:
      name: "Temperatur"
      entity_category: diagnostic
    humidity:
      name: "Luftfeuchtigkeit"
      entity_category: diagnostic

# ── Selects: Winkel ──────────────────────────────────────────────────────────
select:
  # ── Lern-Label ─────────────────────────────────────────────────────────────
  # VOR jeder Testreihe hier einstellen, welche Taste getestet wird. Der Wert
  # landet in jeder LEARN-Zeile, damit die Payload zugeordnet werden kann.
  - platform: template
    name: "Lern-Label (Taste)"
    icon: "mdi:tag"
    optimistic: true
    initial_option: "?"
    options:
      - "?"
      - "Power"
      - "Speed"
      - "Mode-lang"
      - "Oszillation"
      - "Timer"
    set_action:
      - lambda: 'id(learn_label) = x;'

  - platform: template
    name: "Oszillationswinkel"
    icon: "mdi:angle-obtuse"
    entity_category: config
    optimistic: true
    initial_option: "90°"
    options: ["30°", "60°", "90°", "120°", "140°"]
    set_action:
      lambda: |-
        int deg = 90;
        if (x == "30°")  deg = 30;
        if (x == "60°")  deg = 60;
        if (x == "90°")  deg = 90;
        if (x == "120°") deg = 120;
        if (x == "140°") deg = 140;
        id(my_fan)->set_roll_angle(deg);

# ── Timer 0-8h ────────────────────────────────────────────────────────────────
number:
  - platform: template
    name: "Timer (Stunden)"
    icon: "mdi:timer-outline"
    min_value: 0
    max_value: 8
    step: 1
    entity_category: config
    optimistic: true
    set_action:
      lambda: "id(my_fan)->set_timer_hours(x);"

# ── Switches ─────────────────────────────────────────────────────────────────
switch:
  - platform: template
    name: "Kindersicherung"
    icon: "mdi:baby-carriage"
    entity_category: config
    optimistic: true
    turn_on_action:  { lambda: "id(my_fan)->set_child_lock(true);" }
    turn_off_action: { lambda: "id(my_fan)->set_child_lock(false);" }

  - platform: template
    name: "LED Anzeige"
    icon: "mdi:led-on"
    entity_category: config
    optimistic: true
    turn_on_action:  { lambda: "id(my_fan)->set_led(true);" }
    turn_off_action: { lambda: "id(my_fan)->set_led(false);" }

  - platform: template
    name: "Tastentöne"
    icon: "mdi:volume-high"
    entity_category: config
    optimistic: true
    turn_on_action:  { lambda: "id(my_fan)->set_sound(true);" }
    turn_off_action: { lambda: "id(my_fan)->set_sound(false);" }

# ── Diagnose ─────────────────────────────────────────────────────────────────
sensor:
  - platform: template
    name: "Remote Kommandos empfangen"
    icon: "mdi:remote"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return (float) id(cmd_count);'

  - platform: uptime
    name: "Uptime"
    icon: "mdi:timer-outline"
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    icon: "mdi:wifi"
    update_interval: 60s
    entity_category: diagnostic

# Letzte Payload als Hex-STRING (reines ASCII → kein UTF-8-Problem in der API).
text_sensor:
  - platform: template
    name: "Letzte Remote Payload"
    icon: "mdi:bluetooth-transfer"
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(last_payload).empty() ? std::string("-") : id(last_payload);'

  - platform: version
    name: "ESPHome Version"
    icon: "mdi:package-up"
    entity_category: diagnostic

  - platform: template
    name: "ESP-IDF Version"
    id: esp_idf_version
    icon: "mdi:chip"
    entity_category: diagnostic
    update_interval: never

# ── Buttons ──────────────────────────────────────────────────────────────────
button:
  - platform: template
    name: "Nach Links drehen"
    icon: "mdi:pan-left"
    on_press:
      lambda: "id(my_fan)->rotate_left();"

  - platform: template
    name: "Nach Rechts drehen"
    icon: "mdi:pan-right"
    on_press:
      lambda: "id(my_fan)->rotate_right();"
